name: Zbuduj mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: slotbinds-jar
          path: build/libs/slotbinds-1.0.0.jar
